name: Legal Shorts
on:
  pull_request:
    paths: ['shorts/**', 'src/LegalShorts/**', 'src/Root.tsx', 'scripts/shorts/**', 'sources/jlt/**', 'package*.json', '.github/workflows/legal-shorts.yml']
  workflow_dispatch:
    inputs:
      short:
        description: Short id (empty = all shorts)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: legal-shorts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ids
        env:
          ONLY: ${{ inputs.short }}
          BASE: ${{ github.base_ref }}
        run: |
          ids="$ONLY"
          if test -z "$ids" && test -n "$BASE"; then
            ids=$(git diff --name-only --diff-filter=AM "origin/$BASE"...HEAD -- 'shorts/queue/*.json' | xargs -rn1 basename | sed 's/\.json$//')
          fi
          # Template-only changes: smoke-test the next script in the queue.
          if test -z "$ids"; then ids=$(node scripts/shorts/queue.mjs next); fi
          echo "ids=$(printf '%s\n' $ids | jq -R . | jq -cs 'map(select(length>0))')" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install media tools and English voice (Piper "kristin", public-domain dataset)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --quiet piper-tts==1.8.0
          mkdir -p voices
          for f in en_US-kristin-medium.onnx en_US-kristin-medium.onnx.json; do
            curl -fsSL -o "voices/$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/kristin/medium/$f"
          done
      - name: Validate against the official dictionary
        run: |
          npx tsc -p tsconfig.memory.json
          npx eslint src/Root.tsx src/LegalShorts
          npm run shorts:check
      - name: Start Japanese voice
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version && curl -fsS -X POST 'http://127.0.0.1:50021/audio_query?text=%E3%81%82&speaker=14' >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox
          exit 1
      - run: npx remotion browser ensure
      - name: Voice, render, review and gate
        env:
          ID: ${{ matrix.id }}
        run: |
          npm run shorts:prepare -- "$ID" --voice
          npx remotion render src/index.ts LegalShort "out/shorts/$ID/video.mp4" --props="out/shorts/$ID/props.json" --concurrency=2 --crf=20
          npm run shorts:review -- "$ID"
          node scripts/shorts/gate.mjs "$ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-short-${{ matrix.id }}
          path: out/shorts/
          retention-days: 14
          if-no-files-found: ignore

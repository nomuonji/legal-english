name: Judicial YouTube
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [channel-info, update-description, upload-private, publish]
        default: channel-info
        required: true
      render_run_id:
        description: Successful Judicial Memory render run ID (upload-private)
        type: string
      lesson:
        description: Lesson id (upload-private)
        default: shareholder-proposal-numbers
        type: string
      video_id:
        description: Existing verified private video ID (publish)
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: judicial-youtube
  cancel-in-progress: false
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download verified render
        if: inputs.mode == 'upload-private'
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_RUN: ${{ inputs.render_run_id }}
          LESSON: ${{ inputs.lesson }}
        run: |
          node -e "for (const [k,v] of Object.entries({run:process.env.RENDER_RUN,lesson:process.env.LESSON})) if (!(k==='run'?/^[0-9]+$/:/^[a-z0-9-]+$/).test(v||'')) throw Error('Invalid '+k)"
          gh run view "$RENDER_RUN" --json conclusion,name,headSha > /tmp/render-run.json
          node -e "const r=require('/tmp/render-run.json');if(r.conclusion!=='success'||r.name!=='Judicial Memory')throw Error('Not a successful lesson render')"
          gh run download "$RENDER_RUN" --name "judicial-memory-$LESSON" --dir out
      - name: Execute requested YouTube operation
        env:
          MODE: ${{ inputs.mode }}
          LESSON: ${{ inputs.lesson }}
          VIDEO_ID: ${{ inputs.video_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/memory/youtube.mjs
      - name: Save upload receipt
        if: always() && inputs.mode == 'upload-private'
        run: |
          if test -f state/youtube.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add state/youtube.json
            git diff --cached --quiet || (git commit -m 'Record judicial lesson upload' && git push)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-operation
          path: out/youtube-*.json
          if-no-files-found: ignore
